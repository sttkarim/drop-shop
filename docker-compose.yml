services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      WEBAPP_URL: https://${DOMAIN}
      DB_PATH: /data/shop.db
      UPLOADS_DIR: /data/uploads
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      - shopdata:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  shopdata:
  caddy_data:
  caddy_config:
